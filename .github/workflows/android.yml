name: Android CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
          cache-disabled: true

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: keytool -list -keystore release.keystore -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD"

      - name: Build debug and release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --stacktrace --info 2>&1 | tee build.log

      - name: Extract error summary
        if: failure()
        run: |
          grep -E "^e:|^w:|FAILED|error:|Error:|FAILURE|Exception|> Task" build.log | tail -120 > error_summary.txt || true
          echo "" >> error_summary.txt
          echo "=== Last 80 lines of build.log ===" >> error_summary.txt
          tail -80 build.log >> error_summary.txt

      - name: Upload build log and error summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            error_summary.txt
          if-no-files-found: ignore

      - name: Upload build error to repo file (diagnostic)
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, base64, subprocess
          token = os.environ['TOKEN']; sha = os.environ['SHA']
          want = ('e:', 'FAILED', 'what went wrong', 'Exception', 'Task :app:compile',
                  'Unresolved', 'error:', 'w:', 'NotImplemented')
          lines = []
          try:
              with open('build.log', errors='ignore') as f:
                  for ln in f:
                      if any(w in ln for w in want):
                          lines.append(ln.rstrip())
          except FileNotFoundError:
              lines = ['(no build.log found)']
          body = "## Build FAILED (auto diagnostic)\n\n```\n" + "\n".join(lines[-300:]) + "\n```"
          content = base64.b64encode(body.encode('utf-8')).decode('ascii')
          data = json.dumps({
              "message": "diagnostic: build error [skip ci]",
              "content": content
          }).encode('utf-8')
          fname = "BUILD_ERROR_" + sha + ".txt"
          r = subprocess.run([
            "curl","-s","-X","PUT",
            "-H","Authorization: Bearer "+token,
            "-H","Accept: application/vnd.github+json",
            "-H","Content-Type: application/json",
            "https://api.github.com/repos/lrm929/remote-manager/contents/"+fname,
            "--data-binary","@-"
          ], input=data, capture_output=True, text=True)
          print("PUT out:", r.stdout[:600])
          PY

      - name: List all outputs
        run: |
          {
            echo "=== APK files ==="
            find app/build/outputs -type f -name "*.apk" -print || true
            echo "=== All outputs ==="
            find app/build/outputs -type f -print || true
          } > outputs.txt
          cat outputs.txt

      - name: Upload outputs list
        uses: actions/upload-artifact@v4
        with:
          name: outputs-list
          path: outputs.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remote-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remote-manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
